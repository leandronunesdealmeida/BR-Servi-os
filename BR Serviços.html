<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta name="color-scheme" content="light only">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BR Serviços</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEE8;--ink:#17262A;--mut:#5B6B6B;--card:#fff;--line:#CFD5CC;--brand:#1F4B4F;--onbrand:#fff;--accent:#D9822B;--ok:#2F7D4F;--bad:#B3362C;--sel:#E4EFE9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191B;--ink:#E6EBE7;--mut:#93A3A2;--card:#1A2427;--line:#2D3B3F;--brand:#6FB3B0;--onbrand:#0E1A1B;--accent:#E8A05A;--ok:#5DBB82;--bad:#E27B70;--sel:#22343A}}
:root[data-theme="dark"]{--bg:#11191B;--ink:#E6EBE7;--mut:#93A3A2;--card:#1A2427;--line:#2D3B3F;--brand:#6FB3B0;--onbrand:#0E1A1B;--accent:#E8A05A;--ok:#5DBB82;--bad:#E27B70;--sel:#22343A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--brand);color:var(--onbrand);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font:600 16px "IBM Plex Sans Condensed",sans-serif;margin:0;letter-spacing:.06em;white-space:nowrap}.brand{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap}.brand img{height:42px;max-width:210px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}.wm{font:600 20px "IBM Plex Sans Condensed",sans-serif;border:2px solid currentColor;border-radius:4px;padding:0 8px}
h2{font:600 20px "IBM Plex Sans Condensed",sans-serif;margin:0 0 4px}
.seg{display:flex;border:1px solid currentColor;border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;color:inherit;padding:6px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--onbrand);color:var(--brand)}
nav{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
main{max-width:760px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--brand)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);margin:0 4px 2px 0}
.st-aberta,.p-Alta{border-color:var(--accent);color:var(--accent)}.st-andamento{border-color:var(--brand);color:var(--brand)}.st-concluida{border-color:var(--ok);color:var(--ok)}.p-Urgente,.late{border-color:var(--bad);color:var(--bad)}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:6px;padding:9px 14px;font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn.big{width:100%;padding:14px;font-size:16px}.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opts button{flex:1;min-width:90px;padding:11px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.opts button.on{background:var(--sel);border:2px solid var(--brand);font-weight:600}.opts button.on.bad{border-color:var(--bad);color:var(--bad)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.photos img,.sigimg{width:92px;height:92px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.sigimg{width:160px;height:70px;object-fit:contain;background:#fff}
.add{width:92px;height:92px;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--mut);cursor:pointer;margin:0}.add input{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;padding:16px;border-radius:12px 12px 0 0}
canvas{width:100%;height:160px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30}
.sec{margin-top:18px;padding-top:10px;border-top:1px solid var(--line)}.gap{display:flex;gap:8px;margin-top:14px;justify-content:space-between}
</style>
<style>
#bell-wrap{flex-shrink:0}
.bell-panel{right:0;left:auto;max-width:calc(100vw - 24px);max-height:min(70vh,600px);overflow-y:auto;overscroll-behavior:contain}
@media(max-width:600px){.bell-panel{position:fixed!important;top:calc(76px + env(safe-area-inset-top,0px));right:12px!important;left:12px!important;width:auto!important;max-width:none}}
</style>
</head>

function autoGen(){let n=0;S.plans.forEach(p=>{if(!p.auto||!p.proxima||p.proxima>Date.now())return;

 while(p.proxima<=Date.now())p.proxima+=p.freq*DAY});if(n){save();toast(n+" OS gerada(s) por frequência")}return n}

 $("#logo").innerHTML=LOGO?`<img src="${LOGO}" alt="BR Render">`:`<span class="wm">BR Render</span>`;

function assetRows(){const q=ui.q.toLowerCase(),l=S.assets.filter(a=>(ui.inat||!a.inativo)&&(!ui.setor||a.setor==ui.setor)&&(an(a)+a.setor).toLowerCase().includes(q));
 return `<div class="mut" style="margin-bottom:8px">${l.length} ativo(s)${l.length>80?" · mostrando 80, refine a busca":""}</div>`+l.slice(0,80).map(a=>`<div class="card"><div class="row"><div><b>${esc(an(a))}</b>${a.inativo?` <span class="tag">inativo</span>`:""}<div class="mut">${esc(a.setor)} · Criticidade ${esc(a.crit)}</div>${(a.fotos||[])[0]?`<img src="${a.fotos[0]}" alt="Foto do ativo" style="width:56px;height:56px;object-fit:cover;border-radius:6px;margin-top:6px">`:""}</div><button class="btn alt" data-a="delAsset" data-v="${a.id}">Excluir</button></div></div>`).join("")}
function vAssets(){const st=[...new Set(S.assets.map(a=>a.setor))].sort();

function vTeam(){return `<div class="bar"><h2>Equipe</h2><button class="btn" data-a="modal" data-v="tech">+ Técnico</button></div>${S.techs.map(t=>`<div class="card row"><span>${esc(t.nome)}</span><button class="btn alt" data-a="delTech" data-v="${t.id}">Excluir</button></div>`).join("")}<div class="sec"><h2>Dados</h2><div class="mut">Tudo fica salvo neste aparelho. Use o backup para levar os dados a outro aparelho.</div><div class="gap" style="justify-content:flex-start"><button class="btn" data-a="export">Exportar backup</button><label class="btn alt add" style="width:auto;height:auto;padding:9px 14px;color:var(--ink);font-size:14px">Importar backup<input type="file" accept=".json" data-bk></label></div></div>`}

function photos(o,w){return `<div class="photos">${o[w].map((s,i)=>`<img src="${s}" alt="Foto ${w=="before"?"antes":"depois"} ${i+1}">`).join("")}${o.status=="andamento"?`<label class="add">+ Foto<input type="file" accept="image/*" capture="environment" data-photo="${w}"></label>`:""}</div>`}
function vOrder(o){const a=asset(o.assetId),ed=o.status=="andamento",dn=o.status=="concluida",ready=o.items.every(i=>i.ans!=null)&&o.before.length&&o.after.length;
 return `<button class="btn alt" data-a="back">← Voltar</button><div class="card" style="margin-top:12px"><div class="row"><div><h2>OS ${String(o.num).padStart(4,"0")} · ${esc(o.titulo)}</h2><div>${esc(an(a))}</div><div class="mut">${esc(a.setor||"")} · ${o.tipo}</div>${(a.fotos||[]).length?`<div class="photos">${a.fotos.map(f=>`<img src="${f}" alt="Foto do ativo">`).join("")}</div>`:""}</div><span class="tag st-${o.status}">${stL[o.status]}</span></div>
 <div style="margin-top:6px"><span class="tag p-${o.prio}">${o.prio}</span><span class="tag ${late(o)?"late":""}">Prazo ${fd(o.prazo)}</span></div>
 ${ui.role=="gestor"&&!dn?`<label for="as">Técnico responsável</label><select id="as" data-assign><option value="">Sem técnico</option>${S.techs.map(t=>`<option value="${t.id}" ${o.tecId==t.id?"selected":""}>${esc(t.nome)}</option>`).join("")}</select>`:`<div class="mut" style="margin-top:6px">Técnico: ${esc(tech(o.tecId))}</div>`}
 <div class="mut" style="margin-top:6px">Aberta ${fmt(o.criada)} · Início ${fmt(o.inicio)} · Fim ${fmt(o.fim)}</div></div>
 ${o.status=="aberta"?(ui.role=="tecnico"?`<button class="btn big" data-a="start" data-v="${o.id}">Iniciar execução</button>`:`<div class="mut">Aguardando o técnico iniciar.</div>`):`
 <div class="sec"><h2>Foto antes</h2>${photos(o,"before")}</div>
 <div class="sec"><h2>Checklist</h2>${o.items.length?o.items.map((it,i)=>`<div class="card"><b>${i+1}. ${esc(it.q)}</b><div class="opts">${it.opts.map((op,k)=>`<button ${dn?"disabled":""} class="${it.ans===k?"on":""} ${it.ans===k&&k==1?"bad":""}" data-a="ans" data-i="${i}" data-v="${k}">${esc(op)}</button>`).join("")}</div></div>`).join(""):`<div class="mut">OS avulsa, sem checklist.</div>`}</div>
 <div class="sec"><h2>Foto depois</h2>${photos(o,"after")}</div>
 <div class="sec"><h2>Peças usadas</h2>${o.parts.map((p,i)=>`<div class="row" style="margin-bottom:6px"><span>${esc(p.nome)} × ${esc(p.qtd)}</span>${ed?`<button class="btn alt" data-a="delPart" data-v="${i}">Remover</button>`:""}</div>`).join("")||`<div class="mut">Nenhuma peça lançada.</div>`}${ed?`<div class="row" style="margin-top:8px"><input id="pn" placeholder="Peça ou material" style="flex:3"><input id="pq" type="number" min="1" value="1" style="flex:1"><button class="btn" data-a="addPart">Incluir</button></div>`:""}</div>
 <div class="sec"><label for="obs">Observações</label><textarea id="obs" rows="3" ${dn?"disabled":""} data-obs>${esc(o.obs)}</textarea></div>
 ${dn?`<div class="sec"><h2>Assinaturas</h2><div class="mut">Técnico: ${esc(tech(o.tecId))}</div><img class="sigimg" src="${o.sigTec}" alt="Assinatura do técnico">${o.sigSup?`<div class="mut">Responsável pela produção: ${esc(o.supNome)}</div><img class="sigimg" src="${o.sigSup}" alt="Assinatura do responsável da produção">`:""}</div>`:""}
 ${ed?`<div style="margin-top:14px"><button class="btn big" data-a="sign" data-w="tec" ${ready?"":"disabled"}>Assinar e finalizar</button>${ready?"":`<div class="mut" style="margin-top:6px">Para finalizar: responda todo o checklist e anexe ao menos 1 foto antes e 1 depois.</div>`}</div>`:""}`}`}
</script>
<script>
const opt=(l,v)=>l.map(x=>`<option value="${x.id??x}" ${(x.id??x)==v?"selected":""}>${esc(x.nome??x)}</option>`).join("");
const PR=["Baixa","Média","Alta","Urgente"],btns=`<div class="gap"><button type="button" class="btn alt" data-a="close">Cancelar</button><button class="btn">Salvar</button></div>`;
const dl=()=>`<datalist id="dl">${S.assets.filter(a=>!a.inativo).map(a=>`<option value="${esc(a.nome)}">`).join("")}</datalist>`;
function vModal(){const m=ui.modal,P=S.plans.find(p=>p.id==ui.pid)||{};
 if(m=="asset")return `<div class="modal"><form class="sheet" data-f="asset"><h2>Novo ativo</h2><label>Nome</label><input name="nome" required><label>TAG (opcional)</label><input name="tag"><label>Unidade</label><select name="unit" required>${unitOpts(ui.un)}</select><label>Setor</label><input name="setor" value="Geral"><label>Criticidade</label><select name="crit"><option>Alta</option><option selected>Média</option><option>Baixa</option></select>${btns}</form></div>`;
 if(m=="imp")return `<div class="modal"><form class="sheet" data-f="imp"><h2>Importar lista de ativos</h2><div class="mut">Cole um equipamento por linha. O setor é sugerido pelo nome. Linhas “Setor industrial…” são ignoradas e itens “desativado/retirada/reserva” entram como inativos. Nomes repetidos não são duplicados.</div><textarea name="txt" rows="10" required></textarea>${btns}</form></div>`;
 if(m=="tech")return `<div class="modal"><form class="sheet" data-f="tech"><h2>Novo técnico</h2><label>Nome</label><input name="nome" required>${btns}</form></div>`;
 if(m=="plan")return `<div class="modal"><form class="sheet" data-f="plan"><h2>Novo plano</h2>${dl()}<label>Nome do plano</label><input name="nome" required><label>Ativo (digite para buscar)</label><input name="ativo" list="dl" required><label>Tipo</label><select name="tipo" data-tipo><option>Preventiva</option><option>Preditiva</option></select><div id="fq"><label>Frequência (dias)</label><input name="freq" type="number" min="1" value="30"><label>Primeira execução em</label><input name="prox" type="date" value="${addd(30)}"><label><input type="checkbox" name="auto" checked>Gerar OS automaticamente no vencimento</label></div><div id="gt" hidden><label>Gatilho de alerta</label><input name="gatilho" placeholder="Ex.: Vibração > 7 mm/s"><label>Periodicidade da verificação</label><select name="per"><option>Diária</option><option>Semanal</option><option>Quinzenal</option><option selected>Mensal</option><option>Trimestral</option><option>Semestral</option><option>Anual</option></select></div><label>Prioridade padrão</label><select name="prio">${opt(PR,"Média")}</select><label>Técnico padrão</label><select name="tecId"><option value="">Sem técnico</option>${opt(S.techs)}</select><label>Prazo para executar (dias após abrir)</label><input name="prazoDias" type="number" min="1" value="7"><label>Checklist (um item por linha; opções após “|”)</label><textarea name="items" rows="5" placeholder="Vedação sem vazamento? | Conforme, Não conforme, N/A"></textarea>${btns}</form></div>`;
 if(m=="os")return `<div class="modal"><form class="sheet" data-f="os"><h2>Nova ordem de serviço</h2>${dl()}<label>Plano</label><select name="planId"><option value="">Avulsa (sem checklist)</option>${opt(S.plans.map(p=>({id:p.id,nome:p.nome})),ui.pid)}</select><label>Ativo (só para OS avulsa)</label><input name="ativo" list="dl" value="${P.assetId?esc(asset(P.assetId).nome):""}"><label>Título (opcional)</label><input name="titulo"><label>Prioridade</label><select name="prio">${opt(PR,P.prio||"Média")}</select><label>Técnico</label><select name="tecId"><option value="">Sem técnico</option>${opt(S.techs,P.tecId)}</select><label>Prazo</label><input name="prazo" type="date" value="${addd(P.prazoDias||7)}">${btns}</form></div>`;
 return `<div class="modal"><div class="sheet"><h2>${ui.sw=="tec"?"Assinatura do técnico":"Assinatura do supervisor"}</h2>${ui.sw=="sup"?`<label>Nome do supervisor</label><input id="sn">`:""}<label>Assine no quadro</label><canvas id="cv" width="520" height="160"></canvas><div class="gap"><button class="btn alt" data-a="close">Cancelar</button><button class="btn alt" data-a="clear">Limpar</button><button class="btn" data-a="confirmSign">${ui.sw=="tec"?"Finalizar ordem":"Confirmar"}</button></div></div></div>`}
let inked=false;
function initSig(){const c=$("#cv"),x=c.getContext("2d");inked=false;x.lineWidth=2.5;x.lineCap="round";x.strokeStyle="#000";let d=false;
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke();inked=true}};c.onpointerup=()=>d=false}
const A={
 role:d=>{ui.role=d.v;ui.open=null;ui.tab="ordens"},tab:d=>{ui.tab=d.v},open:d=>{ui.open=d.v},back:()=>{ui.open=null},
 modal:d=>{ui.modal=d.v;ui.pid=d.p||""},close:()=>{ui.modal=null},clear:()=>{const c=$("#cv");c.getContext("2d").clearRect(0,0,c.width,c.height);inked=false},
 auto:()=>{if(!autoGen())toast("Nenhum plano vencido")},
 delAsset:d=>{if(confirm("Excluir ativo?")){S.assets=S.assets.filter(a=>a.id!=d.v);save()}},
 delPlan:d=>{if(confirm("Excluir plano?")){S.plans=S.plans.filter(a=>a.id!=d.v);save()}},
 delTech:d=>{if(confirm("Excluir técnico?")){S.techs=S.techs.filter(a=>a.id!=d.v);save()}},
 start:d=>{const o=S.orders.find(x=>x.id==d.v);o.status="andamento";o.inicio=Date.now();save()},
 ans:d=>{S.orders.find(x=>x.id==ui.open).items[+d.i].ans=+d.v;save()},
 addPart:()=>{const n=$("#pn").value.trim();if(!n)return toast("Informe a peça");S.orders.find(x=>x.id==ui.open).parts.push({nome:n,qtd:$("#pq").value||1});save()},
 delPart:d=>{S.orders.find(x=>x.id==ui.open).parts.splice(+d.v,1);save()},
 sign:d=>{ui.sw=d.w;ui.modal="sign"},
 confirmSign:()=>{if(!inked)return toast("Faça a assinatura");const o=S.orders.find(x=>x.id==ui.open),img=$("#cv").toDataURL("image/png");
  if(ui.sw=="tec"){o.sigTec=img;o.status="concluida";o.fim=Date.now()}else{const n=$("#sn").value.trim();if(!n)return toast("Informe o nome");o.sigSup=img;o.supNome=n}
  ui.modal=null;if(ui.sw=="tec")ui.open=null;save();toast(ui.sw=="tec"?"Ordem finalizada e enviada ao gestor":"Registrado")},
 export:()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="backup-manutencao-"+today()+".json";a.click()}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;A[t.dataset.a]?.(t.dataset);render()});
document.addEventListener("input",e=>{const t=e.target;
 if(t.matches("[data-obs]")){S.orders.find(x=>x.id==ui.open).obs=t.value;save()}
 if(t.matches("[data-q]")){ui.q=t.value;$("#lst").innerHTML=assetRows()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.matches("[data-tipo]")){$("#fq").hidden=t.value!="Preventiva";$("#gt").hidden=t.value=="Preventiva"}
 if(t.matches("[data-fs]")){ui.fs=t.value;render()}
 if(t.matches("[data-logo]")&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,120/im.height),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL("image/png");save();render();toast("Logo atualizado")};im.src=r.result};r.readAsDataURL(t.files[0])}

const bellHtml=()=>{const list=alerts();return `<div id="bell-wrap" style="position:relative;order:0"><button class="bell-btn" id="bell-toggle" aria-label="Notificações de manutenção" title="Notificações"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>${list.length?`<span class="bell-count">${list.length>99?'99+':list.length}</span>`:''}</button>${opened?`<div class="bell-panel"><div class="row" style="align-items:center"><b>Alertas de manutenção (${list.length})</b><button class="btn alt" id="bell-close">Fechar</button></div><div class="mut">Atualizados conforme a data atual e o calendário.</div>${list.length?list.map(e=>`<div class="bell-entry"><strong>${esc(e.it.q)} <span class="${e.d<=0?'alert-red':'alert-orange'}">${msg(e)}</span></strong><small>${esc(e.a.unit||'')} · ${esc(e.a.nome)} · ${new Date(e.it.prox).toLocaleDateString('pt-BR')}</small><div class="plan-actions" style="border:0;padding:7px 0 0"><button class="btn alt" data-alert="edit" data-pid="${e.p.id}" data-idx="${e.idx}">Editar</button><button class="btn alt" data-alert="schedule" data-pid="${e.p.id}" data-idx="${e.idx}">Reprogramar</button><button class="btn alt" data-alert="remove" data-pid="${e.p.id}" data-idx="${e.idx}">Remover do calendário</button></div></div>`).join(''):'<div class="empty">Nenhum vencimento dentro do prazo de alerta.</div>'}</div>`:''}</div>`};
const oldRender=render;render=()=>{oldRender();const header=document.querySelector('header');const existing=document.getElementById('bell-wrap');const authenticated=!!cur()&&!ui.boot&&S.sess&&['gestor','adm'].includes(S.sess.role);if(!authenticated){opened=false;existing?.remove();return;}if(header){const role=header.querySelector('#role');if(role){existing?.remove();role.insertAdjacentHTML('beforebegin',bellHtml());}}};
vPlans=()=>{const un=ui.up||'',plans=S.plans.filter(p=>asset(p.assetId).unit===un);return `<div class="bar"><h2>Planos de manutenção</h2><div><button class="btn alt" data-a="impPlan">Importar plano</button> <button class="btn" data-a="modal" data-v="plan">+ Novo plano</button></div></div><label>Unidade</label><select data-up><option value="">Selecione a unidade…</option>${unitOpts(un)}</select>${un?`<div class="mut" style="margin:12px 0">${plans.length} plano(s) · clique em uma linha para ver as ações</div>${plans.map(p=>`<details class="plan-line"><summary><div class="plan-title">${esc(p.nome)}<div class="plan-sub">${esc(an(asset(p.assetId)))} · ${p.items.length} itens · ${esc(p.tipo)}</div></div><span class="tag">${esc(p.prio||'Média')}</span></summary><div class="plan-actions"><button class="btn" data-a="modal" data-v="os" data-p="${p.id}">Gerar OS</button><button class="btn alt" data-a="editPlan" data-v="${p.id}">Editar</button><button class="btn alt" data-a="repPlan" data-v="${p.id}">Replicar</button><button class="btn alt" data-a="expPlan" data-v="${p.id}">Exportar</button><button class="btn alt" data-a="delPlan" data-v="${p.id}">Excluir</button></div></details>`).join('')||'<div class="empty">Nenhum plano cadastrado nesta unidade.</div>'}`:'<div class="empty">Selecione uma unidade para visualizar os planos.</div>'}`};
const previousModal=vModal;vModal=()=>{if(ui.modal==='rep2'){const p=S.plans.find(x=>x.id===ui.pe);if(!p)return previousModal();const un=ui.repUnit||asset(p.assetId).unit;const targets=S.assets.filter(a=>a.unit===un&&!a.inativo);return `<div class="modal"><div class="sheet"><h2>Replicar plano</h2><div class="mut">${esc(p.nome)} · ${p.items.length} itens</div><label>Unidade de destino</label><select id="rep-unit">${unitOpts(un)}</select><label>Equipamento de destino</label><select id="rep-target"><option value="">Selecione o equipamento…</option>${targets.map(a=>`<option value="${a.id}">${esc(an(a))}${a.setor?' · '+esc(a.setor):''}</option>`).join('')}</select><button type="button" class="btn alt" id="rep-add" style="margin-top:9px">+ Adicionar equipamento</button>${(ui.rl||[]).map(id=>`<div class="row" style="margin-top:9px"><span>${esc(asset(id).unit)} · ${esc(an(asset(id)))}</span><button class="btn alt" data-a="rRm" data-v="${id}">Remover</button></div>`).join('')}<div class="gap"><button class="btn alt" data-a="close">Cancelar</button><button type="button" class="btn" id="rep-create">Criar plano(s)</button></div></div></div>`}return previousModal()};
const oldRep=A.repPlan;A.repPlan=d=>{ui.repUnit=asset(S.plans.find(p=>p.id===d.v)?.assetId).unit;ui.repQuery='';oldRep(d)};
function showEdit(pid,idx,kind){const p=S.plans.find(x=>x.id===pid),it=p?.items[idx];if(!it)return;const label=kind==='edit'?'Editar intervenção':'Reprogramar intervenção';ui.alertEdit={pid,idx,kind};opened=false;render();document.querySelector('#modal').innerHTML=`<div class="modal"><form class="sheet" id="alert-form"><h2>${label}</h2><div class="mut">${esc(p.nome)} · ${esc(asset(p.assetId).unit)}</div>${kind==='edit'?`<label>Descrição da atividade</label><textarea name="desc" required rows="3">${esc(it.q)}</textarea>`:''}<label>Data de vencimento</label><input name="due" type="date" required value="${dateKey(it.prox||Date.now())}"><div class="gap"><button class="btn alt" type="button" id="alert-cancel">Cancelar</button><button class="btn" type="submit">Salvar alterações</button></div></form></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cal-reprogram]');if(b){e.preventDefault();e.stopImmediatePropagation();showEdit(b.dataset.pid,Number(b.dataset.idx),'schedule');}},true);
document.addEventListener('click',e=>{if(e.target.closest('#bell-toggle')){e.preventDefault();opened=!opened;render();return}if(e.target.closest('#bell-close')){opened=false;render();return}if(opened&&!e.target.closest('#bell-wrap')){opened=false;render();return}const b=e.target.closest('[data-alert]');if(b){e.preventDefault();const p=S.plans.find(x=>x.id===b.dataset.pid),idx=+b.dataset.idx,it=p?.items[idx];if(!it)return;if(b.dataset.alert==='remove'){if(confirm('Remover esta programação do calendário? O item permanecerá no plano.')){it.prox=0;it.manual=false;p.proxima=Math.min(...p.items.map(i=>i.prox||1e15));save();render()}}else showEdit(p.id,idx,b.dataset.alert);return}if(e.target.id==='alert-cancel'){ui.alertEdit=null;render();return}if(e.target.id==='rep-create'){e.preventDefault();e.stopImmediatePropagation();const id=document.querySelector('#rep-target')?.value,p=S.plans.find(x=>x.id===ui.pe);if(!p)return toast('Plano de origem não encontrado');const ids=[...new Set([...(ui.rl||[]),...(id?[id]:[])])].filter(x=>x!==p.assetId&&S.assets.some(a=>a.id===x));if(!ids.length)return toast('Selecione um equipamento de destino');ids.forEach(assetId=>{const c=JSON.parse(JSON.stringify(p));c.items.forEach(i=>delete i.ultima);S.plans.push({...c,id:uid(),assetId,unit:S.assets.find(a=>a.id===assetId)?.unit||""})});ui.rl=[];ui.modal=null;save();render();toast(ids.length+' plano(s) criado(s)');return}if(e.target.id==='rep-add'){e.preventDefault();const id=document.querySelector('#rep-target')?.value,p=S.plans.find(x=>x.id===ui.pe);if(!id)return toast('Selecione um equipamento');if(id===p.assetId||(ui.rl||[]).includes(id))return toast('Equipamento já selecionado');(ui.rl||=[]).push(id);render()}} ,true);
document.addEventListener('change',e=>{if(e.target.id==='rep-unit'){ui.repUnit=e.target.value;ui.repQuery='';render()}},true);
document.addEventListener('input',e=>{if(e.target.id==='rep-search'){ui.repQuery=e.target.value;const list=document.querySelector('#rep-target'),q=ui.repQuery.toLowerCase();if(list)list.innerHTML='<option value="">Selecione o equipamento…</option>'+S.assets.filter(a=>a.unit===ui.repUnit&&!a.inativo&&(an(a)+' '+a.setor).toLowerCase().includes(q)).map(a=>`<option value="${a.id}">${esc(an(a))}</option>`).join('')}},true);
document.addEventListener('submit',e=>{if(e.target.id!=='alert-form')return;e.preventDefault();e.stopImmediatePropagation();const {pid,idx,kind}=ui.alertEdit||{},p=S.plans.find(x=>x.id===pid),it=p?.items[idx];if(!it)return;const d=new FormData(e.target);if(kind==='edit')it.q=String(d.get('desc')||'').trim();it.prox=new Date(String(d.get('due'))+'T08:00:00').getTime();it.manual=true;p.proxima=Math.min(...p.items.map(x=>x.prox||1e15));ui.alertEdit=null;save();render();toast('Intervenção atualizada')},true);
render();
})();
</script>
</body>
</html>
